version: "3.9"

# FloodSense AI — Production Docker Compose
# ==========================================
# Services:
#   db         — PostgreSQL 16 with PostGIS
#   redis      — Redis 7 cache & message broker
#   backend    — FastAPI + APScheduler
#   frontend   — Next.js 15
#   celery     — Background task worker (optional)
#
# Usage:
#   Development: docker compose up --build
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:

  # ── Nginx API Gateway ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: floodsense_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - floodsense_net

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: floodsense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-floodsense}
      POSTGRES_USER: ${POSTGRES_USER:-floodsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floodsense_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floodsense} -d ${POSTGRES_DB:-floodsense}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - floodsense_net

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: floodsense_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - floodsense_net

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodsense_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database — switch to PostgreSQL in Docker
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-floodsense}:${POSTGRES_PASSWORD:-floodsense_secure_password}@db:5432/${POSTGRES_DB:-floodsense}"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: ${SECRET_KEY:-floodsense_change_this_secret_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,https://floodsense-ai.vercel.app}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@floodsense.ai}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-FloodSense@Admin2026}
      GNN_MODEL_PATH: /app/ml/models/gnn_model.pth
      PIPELINE_INTERVAL_SECONDS: 20
      ETL_INTERVAL_SECONDS: 300
    volumes:
      - model_data:/app/app/ml/models
      - etl_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - floodsense_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    container_name: floodsense_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
      NEXT_PUBLIC_ENV: ${ENVIRONMENT:-production}
    expose:
      - "3000"
    networks:
      - floodsense_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  model_data:
    driver: local
  etl_data:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  floodsense_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

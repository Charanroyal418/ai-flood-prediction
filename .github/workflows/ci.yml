name: FloodSense AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ── Backend Lint & Test ───────────────────────────────────────────────────
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Lint with Ruff
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check app/ --ignore E501 || true

      - name: Type check with mypy (non-blocking)
        working-directory: ./backend
        run: |
          pip install mypy
          mypy app/ --ignore-missing-imports || true

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:///./test_floodsense.db"
          SECRET_KEY: "test_secret_key_for_ci_pipeline"
          ENVIRONMENT: "testing"
        run: |
          PYTHONPATH=. pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing \
            --ignore=tests/test_etl.py \
            -k "not test_etl"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false

  # ── Frontend Lint & Build ─────────────────────────────────────────────────
  frontend-build:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Lint TypeScript
        working-directory: ./frontend
        run: npm run lint

      - name: Build Next.js
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ── Security Scan ─────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python dependency audit
        working-directory: ./backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-45 || true

      - name: npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true
